name: Refresh movie rankings

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rankings-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test ranking periods and Lampa filters
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
      - name: Build rankings from Trakt and TMDB
        if: ${{ vars.RANKINGS_ENABLED == 'true' }}
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python scripts/build_rankings.py
      - name: Verify feed dates and client release policy
        if: ${{ vars.RANKINGS_ENABLED == 'true' }}
        run: |
          python - <<'PY'
          import datetime, json
          feed = json.load(open('data/rankings.json'))
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          weekly = feed['rows']['weekly']
          assert feed['release_policy'] == 'client'
          assert all(c['release_date'] <= today for row in feed['rows'].values() for c in row)
          print('Weekly candidates across release years:', len(weekly))
          print('Row sources:', feed['row_sources'])
          PY
      - name: Publish updated data
        if: ${{ vars.RANKINGS_ENABLED == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rankings.json data/watch-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update movie rankings'
            git push
          fi
      - name: Prepare Pages files
        run: |
          mkdir -p _site/data
          cp index.html vlas.js _site/
          if [ -f data/rankings.json ]; then cp data/rankings.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
