name: Refresh movie rankings

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build rankings from Trakt and TMDB
        if: ${{ vars.RANKINGS_ENABLED == 'true' }}
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python scripts/build_rankings.py
      - name: Publish updated data
        if: ${{ vars.RANKINGS_ENABLED == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rankings.json data/watch-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update movie rankings'
            git push
          fi
      - name: Prepare Pages files
        run: |
          mkdir -p _site/data
          cp index.html vlas.js _site/
          if [ -f data/rankings.json ]; then cp data/rankings.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
