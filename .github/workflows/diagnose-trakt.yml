name: Diagnose Trakt requests
on:
  push:
    branches: [fix/trakt-request-failure]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check each public Trakt period without exposing credentials
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          python -u - <<'PY'
          import os, json, time, urllib.request, urllib.error
          headers = {'trakt-api-key': os.environ['TRAKT_CLIENT_ID'], 'trakt-api-version': '2', 'Content-Type': 'application/json', 'User-Agent': 'VlasLampaHome/3.0'}
          for period, limit in [('weekly',200),('monthly',200),('yearly',200),('daily',250)]:
              for query in ['?page=1&limit='+str(limit), '?limit='+str(limit)+'&page=1', '?page=1&limit=100']:
                  path = '/movies/watched/' + period + query
                  started = time.monotonic()
                  try:
                      with urllib.request.urlopen(urllib.request.Request('https://api.trakt.tv'+path,headers=headers), timeout=25) as response:
                          payload=json.load(response)
                          print(path, response.status, 'items', len(payload), 'seconds', round(time.monotonic()-started,1), flush=True)
                  except urllib.error.HTTPError as error:
                      print(path, 'HTTP', error.code, 'seconds', round(time.monotonic()-started,1), flush=True)
                  except Exception as error:
                      print(path, type(error).__name__, 'seconds', round(time.monotonic()-started,1), flush=True)
          PY
